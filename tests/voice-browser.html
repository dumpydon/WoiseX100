<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WoiseX100 controlled voice QA</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <p>Loading controlled voice QA. No real microphone will be used.</p>
  <script type="module">
    // Local-only test entry point. It is not imported by the production app or included in its assets.
    const template = new DOMParser().parseFromString(await (await fetch('/index.html')).text(), 'text/html');
    document.body.replaceChildren(...template.body.childNodes);
    const contexts = new Set();
    const preferenceKeys = ['interface-sounds', 'playback', 'openai-voice', 'device-voice', 'speech-speed'];
    const previousPreferences = preferenceKeys.map(name => ['woisex100:' + name, localStorage.getItem('woisex100:' + name)]);
    const test = window.__voiceTest = { scenario: 'success', chimes: 0, starts: 0, streams: [], states: [], latest: null, pending: null, NativeRecognition: window.SpeechRecognition ?? window.webkitSpeechRecognition };
    const controls = document.createElement('div');
    controls.style.cssText = 'position:fixed;z-index:10000;bottom:0;left:0;background:#fff;color:#111;padding:6px;font:12px sans-serif;display:flex;gap:6px;align-items:center';
    controls.innerHTML = '<strong>Synthetic voice QA</strong><select aria-label="Test scenario"><option value="success">Success</option><option value="overlap">First words during chime</option><option value="denied">Permission denied</option><option value="service-error">Service failure</option><option value="tts-error">Speech playback failure</option><option value="pending">Pending permission</option><option value="duplicate">Duplicate events</option></select><button type="button">Speak test phrase</button><button type="button">Resolve permission</button>';
    document.body.append(controls);
    controls.querySelector('select').onchange = event => { test.scenario = event.target.value; test.overlapSent = false; };
    controls.querySelector('select').append(new Option('Embedded browser: blob URLs unavailable', 'blob-blocked'));
    controls.querySelector('select').append(new Option('Reply waiting for manual completion', 'reply-pending'));
    controls.style.flexWrap = 'wrap';
    const volume = document.createElement('select'); volume.setAttribute('aria-label', 'Controlled microphone volume');
    for (const [value, name] of [[0, 'Silence'], [.0035, 'Background noise'], [.012, 'Quiet speech'], [.036, 'Normal speech'], [.10, 'Strong speech']]) volume.append(new Option(name, String(value)));
    test.volume = 0;
    volume.onchange = () => {
      test.volume = Number(volume.value);
      const record = test.streams.at(-1);
      record?.gain.gain.setTargetAtTime(test.volume, record.context.currentTime, .015);
    };
    controls.append(volume);
    const resolveReply = document.createElement('button'); resolveReply.type = 'button'; resolveReply.textContent = 'Resolve reply';
    resolveReply.onclick = () => test.resolveReply?.(); controls.append(resolveReply);
    const phrase = document.createElement('input'); phrase.setAttribute('aria-label', 'Test spoken phrase'); phrase.value = 'Hello from the first word'; controls.append(phrase);
    const gap = document.createElement('select'); gap.setAttribute('aria-label', 'Test speech pause');
    for (const ms of [1000, 2500, 2900]) gap.append(new Option(`${ms} ms pause`, String(ms)));
    controls.append(gap);
    const sequence = document.createElement('button'); sequence.textContent = 'Speak two-part turn'; sequence.type = 'button'; controls.append(sequence);
    sequence.onclick = () => {
      test.sequence = { pause: Number(gap.value), began: performance.now() };
      test.latest?.speak('This is my');
      setTimeout(() => {
        const record = test.streams.at(-1);
        test.sequence.beforeContinuation = { at: performance.now(), mic: document.querySelector('#voice-stage').dataset.micState,
          raw: record.stream.getTracks().map(track => track.readyState), processed: test.latest?.input?.readyState,
          submissions: test.replyCalls.length };
        test.latest?.speak('complete answer.');
      }, 450 + Number(gap.value));
    };
    const endRecognition = document.createElement('button'); endRecognition.type = 'button'; endRecognition.textContent = 'End recognition session'; controls.append(endRecognition);
    endRecognition.onclick = () => { if (test.latest) { test.latest.active = false; test.latest.onend?.(); } };
    const originalPlay = HTMLMediaElement.prototype.play;
    HTMLMediaElement.prototype.play = function (...args) {
      if (test.scenario === 'blob-blocked' && this.src.startsWith('blob:')) return Promise.reject(new DOMException('Controlled blob URL rejection', 'NotSupportedError'));
      return originalPlay.apply(this, args);
    };
    const OriginalStart = AudioBufferSourceNode.prototype.start;
    AudioBufferSourceNode.prototype.start = function (...args) {
      if (!(this.context instanceof OfflineAudioContext) && Math.abs((this.buffer?.duration ?? 0) - .4) < .001) { test.chimes += 1; test.cueAt = performance.now(); }
      return OriginalStart.apply(this, args);
    };
    class FakeRecognition {
      constructor() { test.latest = this; this.active = false; this.results = []; }
      start(input) {
        if (!(input instanceof MediaStreamTrack)) throw new TypeError('A track is required');
        this.input = input;
        test.starts += 1;
        this.active = true;
        setTimeout(() => {
          if (!this.active) return;
          if (test.scenario === 'service-error') { this.onerror?.({ error: 'network' }); return; }
          this.onstart?.(); this.onaudiostart?.();
          if (test.scenario === 'duplicate') { this.onstart?.(); this.onaudiostart?.(); }
          if (test.scenario === 'overlap' && !test.overlapSent) { test.overlapSent = true; setTimeout(() => this.speak(), 20); }
        }, 80);
      }
      abort() { this.active = false; }
      stop() {
        this.active = false;
        for (const result of this.results) result.isFinal = true;
        this.onresult?.({ resultIndex: 0, results: this.results.slice() });
        this.onend?.();
      }
      speak(text = phrase.value) {
        if (!this.active) return;
        test.firstWordsAt = performance.now();
        this.onspeechstart?.();
        const stream = test.streams.at(-1);
        if (stream?.gain) {
          stream.gain.gain.setValueAtTime(.12, stream.context.currentTime);
          stream.gain.gain.setValueAtTime(0, stream.context.currentTime + .45);
        }
        const index = this.results.length;
        const partial = [{ transcript: text }]; partial.isFinal = false;
        this.results[index] = partial;
        this.onresult?.({ resultIndex: index, results: this.results.slice() });
        setTimeout(() => { if (this.active) { test.speechEndedAt = performance.now(); this.onspeechend?.(); } }, 450);
        setTimeout(() => {
          if (!this.active) return;
          const final = [{ transcript: text }]; final.isFinal = true;
          this.results[index] = final;
          this.onresult?.({ resultIndex: index, results: this.results.slice() });
        }, 650);
      }
    }
    window.SpeechRecognition = window.webkitSpeechRecognition = FakeRecognition;
    async function fakeStream() {
      const context = new AudioContext(); contexts.add(context); await context.resume();
      const oscillator = context.createOscillator(); oscillator.frequency.value = 175;
      const gain = context.createGain(); gain.gain.value = test.volume;
      const destination = context.createMediaStreamDestination();
      oscillator.connect(gain); gain.connect(destination); oscillator.start();
      const record = { context, gain, stream: destination.stream, oscillator };
      test.streams.push(record);
      return destination.stream;
    }
    Object.defineProperty(navigator.mediaDevices, 'getUserMedia', { configurable: true, value: () => {
      test.permissionCalls = (test.permissionCalls ?? 0) + 1;
      if (test.scenario === 'denied') return Promise.reject(new DOMException('Test denial', 'NotAllowedError'));
      if (test.scenario === 'pending') return new Promise(resolve => { test.pending = () => fakeStream().then(resolve); });
      return fakeStream();
    } });
    const normalFetch = window.fetch.bind(window);
    test.speechCalls = []; test.replyCalls = [];
    window.fetch = (input, options) => {
      if (String(input).endsWith('/api/reply')) {
        test.replyCalls.push({ at: performance.now(), body: JSON.parse(options.body) });
        if (test.scenario === 'reply-pending') return new Promise((resolve, reject) => {
          test.resolveReply = () => resolve(Response.json({ text: 'Controlled playback test.' }));
          options.signal?.addEventListener('abort', () => reject(new DOMException('Test reply cancelled', 'AbortError')), { once: true });
        });
        return Promise.resolve(Response.json({ text: 'Controlled playback test.' }));
      }
      if (String(input).endsWith('/api/speech')) {
        test.speechCalls.push(JSON.parse(options.body));
        if (test.scenario === 'tts-error') return Promise.resolve(Response.json({ error: 'Controlled OpenAI speech failure.', code: 'generation_failed' }, { status: 503 }));
      }
      return normalFetch(input, options);
    };
    controls.querySelectorAll('button')[0].onclick = () => test.latest?.speak();
    controls.querySelectorAll('button')[1].onclick = () => test.pending?.();
    new MutationObserver(() => {
      const stage = document.querySelector('#voice-stage');
      if (test.states.at(-1) !== stage.dataset.state) test.states.push(stage.dataset.state);
      test.peakLevel = Math.max(test.peakLevel ?? 0, Number(stage.style.getPropertyValue('--mic-level')) || 0);
      test.scaleSamples ??= [];
      test.scaleSamples.push({ time: performance.now(), scale: Number(stage.style.getPropertyValue('--orb-scale')) || 1, mic: stage.dataset.micState });
      if (test.scaleSamples.length > 900) test.scaleSamples.splice(0, test.scaleSamples.length - 900);
    }).observe(document.querySelector('#voice-stage'), { attributes: true, attributeFilter: ['data-state', 'style'] });
    test.restorePreferences = () => {
      for (const [key, value] of previousPreferences) {
        if (value === null) localStorage.removeItem(key);
        else localStorage.setItem(key, value);
      }
    };
    window.addEventListener('pagehide', () => {
      for (const context of contexts) context.close();
      test.restorePreferences();
    });
    await import('/src/app.js?controlled-voice-qa');
    test.checkFilters = async () => {
      const { activationChimeSamples, CHIME_FILTER_FREQUENCIES, CHIME_FILTER_Q } = await import('/src/voice-audio.js');
      const rate = 48000;
      const offline = new OfflineAudioContext(4, rate, rate);
      const cue = offline.createBuffer(1, Math.round(rate * .4), rate);
      cue.copyToChannel(activationChimeSamples(rate), 0);
      const vocal = await offline.decodeAudioData(await (await normalFetch('/tests/fixtures/first-words.wav')).arrayBuffer());
      const merger = offline.createChannelMerger(4); merger.connect(offline.destination);
      const connect = (buffer, channel, filtered) => {
        const source = offline.createBufferSource(); source.buffer = buffer;
        let tail = source;
        if (filtered) for (const frequency of CHIME_FILTER_FREQUENCIES) {
          const filter = offline.createBiquadFilter(); filter.type = 'notch'; filter.frequency.value = frequency; filter.Q.value = CHIME_FILTER_Q;
          tail.connect(filter); tail = filter;
        }
        tail.connect(merger, 0, channel); source.start(.02);
      };
      connect(cue, 0, false); connect(cue, 1, true);
      connect(vocal, 2, false); connect(vocal, 3, true);
      const rendered = await offline.startRendering();
      const rms = data => Math.sqrt(data.reduce((sum, value) => sum + value * value, 0) / data.length);
      const rawCue = rms(rendered.getChannelData(0)); const filteredCue = rms(rendered.getChannelData(1));
      const voice = rendered.getChannelData(2), filteredVoice = rendered.getChannelData(3);
      let onset = voice.findIndex(value => Math.abs(value) > .002);
      const segment = Math.round(rate * .08);
      return { cueAttenuationDb: 20 * Math.log10(filteredCue / rawCue), firstVoiceMs: onset / rate * 1000,
        firstWordEnergyRatio: rms(filteredVoice.slice(onset, onset + segment)) / rms(voice.slice(onset, onset + segment)) };
    };
  </script>
</body>
</html>
